[project]
name = "food-service"
version = "0.1.0"
description = "Weekly PCOS-friendly meal planner (single-tenant, local-first)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "httpx",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pytest-playwright",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
