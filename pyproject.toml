[project]
name = "food-service"
version = "0.1.0"
description = "Weekly dinner planner grounded in Danish grocery offers, with deterministic macros"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "httpx",
    "python-dotenv",
    "psycopg[binary]>=3.3.6",
    "psycopg-pool>=3.3.3",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pytest-playwright",
    "testcontainers>=4.15.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
